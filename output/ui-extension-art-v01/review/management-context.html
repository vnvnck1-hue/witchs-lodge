<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달빛 UI · 기존 게임 화면 배치 검토</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211a2e}.viewport{position:relative;width:100%;height:100%}.stage{position:absolute;width:1774px;height:887px;transform-origin:0 0}.scene{position:absolute;inset:0;width:1774px;height:887px}.panel{position:absolute;left:527px;top:86px;width:720px;height:720px}.art{position:absolute;inset:0;width:100%;height:100%}.price{position:absolute;left:70.7%;width:18%;height:5.5%;display:flex;justify-content:center;align-items:center;color:#fce7b0;font:700 13px/1.2 "Malgun Gothic",sans-serif;text-shadow:0 1px #160c28}.price:nth-of-type(1){top:26.9%}.price:nth-of-type(2){top:37.5%}.price:nth-of-type(3){top:48.1%}.price:nth-of-type(4){top:58.8%}.price:nth-of-type(5){top:69.4%}.price:nth-of-type(6){top:80%}.no-panel .panel{display:none}</style></head>
<body><div class="viewport"><div class="stage"><img class="scene" src="../references/current-game.png" alt="기존 게임 HUD와 배경 원본"><div class="panel"><img class="art" src="../05-management-frame-transparent.png" alt="새 관리창 원화"><span class="price">60G · 목재 10</span><span class="price">40G · 목재 8</span><span class="price">30G · 목재 6</span><span class="price">20G</span><span class="price">10G</span><span class="price">10G</span></div></div></div>
<script>const stage=document.querySelector('.stage'),box=document.querySelector('.viewport');const fit=()=>stage.style.transform=`scale(${Math.min(box.clientWidth/1774,box.clientHeight/887)})`;new ResizeObserver(fit).observe(box);fit();window.addEventListener('message',e=>{if(e.data?.type==='panel-visibility')document.body.classList.toggle('no-panel',!e.data.visible);if(e.data?.type==='panel-size'){const p=document.querySelector('.panel'),s=e.data.size;p.style.width=s+'px';p.style.height=s+'px';p.style.left=(1774-s)/2+'px';p.style.top=(887-s)/2+'px';}});</script></body></html>
