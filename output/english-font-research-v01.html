<style>
:root{--bg:#f4efe6;--fg:#2a2230;--muted:#6b6270;--card:#fffaf2;--line:#d9cfc0;--accent:#6b3fa0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131c;--fg:#ece6f2;--muted:#a59cae;--card:#221c29;--line:#3a3143;--accent:#b591e6}}
:root[data-theme="dark"]{--bg:#17131c;--fg:#ece6f2;--muted:#a59cae;--card:#221c29;--line:#3a3143;--accent:#b591e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
main{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:40px 0 12px}
p.lead{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
figcaption{margin-top:10px;font-size:13px}
figcaption b{display:block;font-size:14px}
figcaption .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;margin-right:4px}
figcaption span.m{color:var(--muted)}
.card{position:relative;width:100%;aspect-ratio:2/3;container-type:inline-size;border-radius:6px;overflow:hidden;background:#3b2a52}
.card img{position:absolute;inset:0;width:100%;height:100%}
.card .t,.card .c,.card .b,.card .r{position:absolute;left:0;right:0;text-align:center;color:#1d1410}
.card .t{top:4.6%;font-size:11.5cqw;line-height:1}
.card .c{top:12.6%;left:15%;right:15%;font-size:3.7cqw;line-height:1;white-space:nowrap}
.card .b{top:69.4%;font-size:4.4cqw;line-height:1}
.card .r{top:78%;left:9%;right:9%;font-size:5.3cqw;line-height:1.35}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.s{font-size:22px;white-space:nowrap}
.wrap{overflow-x:auto}
</style>
</head>

<h1>마녀산장 영문 카드 폰트 비교 v01</h1>
<p class="lead">글자를 지운 실제 카드(채집가) 위에 영문 문구를 얹은 시안입니다. 모든 폰트는 Google Fonts 공식 저장소의 SIL OFL 1.1 폰트로, 무료이고 상업적으로 쓸 수 있습니다. 왼쪽 첫 장은 현재 한글판(BM 을지로체)입니다. 이 페이지는 Google Fonts를 불러오므로 인터넷 연결이 필요합니다.</p>
